name: Chiaki NR portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-protobuf
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libplacebo mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-libevent mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-speexdsp mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-vulkan-headers
      - name: Собрать
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DCHIAKI_ENABLE_SETSU=OFF -DCHIAKI_ENABLE_TESTS=OFF -DCHIAKI_USE_SYSTEM_CURL=ON
          cmake --build build --target chiaki -j4
      - name: Собрать чистый portable
        run: python scripts/package-nr.py --prefix /ucrt64 --build build --output dist/Chiaki-NR
      - name: Проверить portable-настройки
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='windows'
          $exe=Join-Path $pwd 'dist/Chiaki-NR/chiaki.exe'
          $p=Start-Process -FilePath $exe -ArgumentList '--portable-check' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Portable check failed'}
          $config=Join-Path $pwd 'dist/Chiaki-NR/config'
          if(!(Test-Path -LiteralPath $config)){throw 'No portable config'}
          $expected=[IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'dist/Chiaki-NR/config'))
          if((Resolve-Path -LiteralPath $config).Path -ne $expected){throw 'Unexpected config path'}
          Remove-Item -LiteralPath $config -Recurse -Force
      - name: Упаковать
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python scripts/source-archive.py dist/Chiaki-NR-source.zip
          cd dist
          zip -qr "Chiaki-NR-${RELEASE_REF}-windows-x64-portable.zip" Chiaki-NR
          sha256sum *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Chiaki-NR-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title "Chiaki NR $env:RELEASE_TAG" --notes-file CHANGELOG.md dist/*.zip dist/SHA256SUMS.txt
          if($LASTEXITCODE -ne 0){throw 'Release failed'}
